name: courier_mobile
description: "NUSA-DHIPA Courier Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^13.0.1
  flutter_native_splash: ^2.4.7
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#E5232E"
  image: "assets/branding/courier_logo.png"
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: scaleDown
  fullscreen: true

  android_12:
    image: "assets/branding/courier_logo.png"
    color: "#E5232E"
    icon_background_color: "#FFFFFF"
